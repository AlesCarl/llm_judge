schemaVersion: "1"
kind: mixin
name: nika-sdk
displayName: NIKA SDK dependencies
description: >
  Optional reference mixin. Prefer NIKA_SANDBOX_OFFLINE_SDK_WHEELS so the host
  stages wheels and installs them via `sbx exec` after create
  (see agent.sandbox.sbx.wheels). Pins live in requirements-sdk.txt. Kit install
  hooks were SIGKILL'd (exit 137) during slow in-VM PyPI downloads.

network:
  allowedDomains:
    - pypi.org
    - files.pythonhosted.org
    - pypi.python.org

commands:
  install:
    # Legacy path — keep in sync with top-level pins in ../requirements-sdk.txt
    - command: "pip3 install --break-system-packages --retries 10 --timeout 120 'pydantic==2.13.4' 'python-dotenv==1.2.2' 'langchain-core==1.4.9' 'openai-codex==0.1.0b3' 'claude-agent-sdk==0.2.119'"
      user: "0"
      description: Install NIKA SDK agent dependencies (legacy; prefer offline wheels path)
